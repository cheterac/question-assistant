<!doctype html><html lang="ru"><meta charset="utf-8"><title>Настройка Groq</title><link rel="stylesheet" href="setup.css"><main><h1>Ответ по скриншоту</h1><p>Введите личный <a href="https://console.groq.com/keys" target="_blank" rel="noreferrer">ключ Groq</a>. Он хранится в памяти до перезапуска браузера. Снимок отправляется после подтверждения. Каждый следующий запрос включает тот же снимок и чат.</p><label>Ключ Groq <input id="key" type="password" autocomplete="off"></label> <button id="save">Сохранить</button> <button id="remove">Забыть ключ</button><p id="status" role="status"></p></main><script src="setup.js"></script></html>
